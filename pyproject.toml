[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpbouncer"
version = "0.1.0"
description = "A declared, versioned policy gate that sits in front of MCP servers -- unmatched is denied."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Ethan Haas" }]
keywords = ["mcp", "model-context-protocol", "proxy", "policy", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
mcpbouncer = "mcpbouncer.cli:main"

[project.urls]
Homepage = "https://github.com/ethan-haas/mcpbouncer"
Repository = "https://github.com/ethan-haas/mcpbouncer"

[tool.setuptools.packages.find]
include = ["mcpbouncer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
